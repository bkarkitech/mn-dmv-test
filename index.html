<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minnesota DMV Practice Test 🌊</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --mn-blue: #003F87;
    --mn-blue-light: #1A5FAD;
    --mn-blue-dark: #002A5C;
    --mn-gold: #FFD700;
    --mn-gold-dark: #E6C200;
    --correct: #22C55E;
    --correct-bg: #DCFCE7;
    --wrong: #EF4444;
    --wrong-bg: #FEE2E2;
    --neutral-bg: #F0F4FA;
    --card-bg: #FFFFFF;
    --text-main: #1A2744;
    --text-muted: #5A6A8A;
    --border: #D1DDEF;
    --shadow: 0 4px 24px rgba(0,63,135,0.10);
    --shadow-lg: 0 8px 40px rgba(0,63,135,0.16);
    --radius: 18px;
    --radius-sm: 10px;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito Sans', sans-serif;
    background: linear-gradient(160deg, #EEF4FF 0%, #F7F9FF 50%, #FFF9E6 100%);
    min-height: 100vh;
    color: var(--text-main);
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    background: linear-gradient(135deg, var(--mn-blue-dark) 0%, var(--mn-blue) 60%, var(--mn-blue-light) 100%);
    color: white;
    padding: 28px 20px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 70% 0%, rgba(255,215,0,0.18) 0%, transparent 60%);
    pointer-events: none;
  }
  .header-wave {
    position: absolute;
    bottom: -2px; left: 0; right: 0;
    height: 28px;
    background: linear-gradient(160deg, #EEF4FF 0%, #F7F9FF 50%, #FFF9E6 100%);
    clip-path: ellipse(55% 100% at 50% 100%);
  }
  .header-emoji { font-size: 2.6rem; margin-bottom: 6px; display: block; animation: bobble 3s ease-in-out infinite; }
  @keyframes bobble { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  .header-title {
    font-family: 'Nunito', sans-serif;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    font-weight: 900;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 8px rgba(0,0,0,0.25);
  }
  .header-title span { color: var(--mn-gold); }
  .header-sub {
    font-size: 0.92rem;
    opacity: 0.8;
    margin-top: 4px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  /* ── STICKY TOP BAR ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255,255,255,0.97);
    backdrop-filter: blur(10px);
    border-bottom: 2px solid var(--border);
    padding: 12px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: space-between;
    box-shadow: 0 2px 12px rgba(0,63,135,0.08);
  }
  .score-pill {
    background: var(--mn-blue);
    color: white;
    border-radius: 50px;
    padding: 8px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .score-pill .score-num { color: var(--mn-gold); font-size: 1.15rem; }
  .progress-pill {
    background: var(--neutral-bg);
    color: var(--text-muted);
    border-radius: 50px;
    padding: 8px 16px;
    font-weight: 700;
    font-size: 0.9rem;
    white-space: nowrap;
  }
  .mode-toggle {
    display: flex;
    background: var(--neutral-bg);
    border-radius: 50px;
    padding: 3px;
    gap: 2px;
  }
  .mode-btn {
    background: transparent;
    border: none;
    border-radius: 50px;
    padding: 7px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;
    cursor: pointer;
    color: var(--text-muted);
    transition: all 0.2s;
  }
  .mode-btn.active {
    background: var(--mn-blue);
    color: white;
    box-shadow: 0 2px 8px rgba(0,63,135,0.25);
  }

  /* ── SIGNS MODE ── */
  .signs-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 18px;
    animation: fadeIn 0.4s ease;
  }
  .sign-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 20px 16px 16px;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    transition: border-color 0.2s, box-shadow 0.2s;
    animation: slideUp 0.4s ease both;
    cursor: pointer;
  }
  .sign-card:hover { box-shadow: var(--shadow-lg); border-color: var(--border); }
  .sign-card.sc-correct { border-color: var(--correct); background: #F0FFF4; }
  .sign-card.sc-wrong   { border-color: var(--wrong);   background: #FFF5F5; }
  .sign-svg-wrap {
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .sign-svg-wrap svg { width: 100%; height: 100%; }
  .sign-question {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    color: var(--text-main);
    text-align: center;
    line-height: 1.4;
  }
  .sign-opts {
    display: flex;
    flex-direction: column;
    gap: 7px;
    width: 100%;
  }
  .sign-opt-btn {
    background: var(--neutral-bg);
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    padding: 9px 12px;
    cursor: pointer;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.88rem;
    font-weight: 600;
    color: var(--text-main);
    text-align: left;
    transition: all 0.18s;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 8px;
    line-height: 1.35;
  }
  .sign-opt-btn:hover:not(:disabled) {
    background: #E8EFFE;
    border-color: var(--mn-blue-light);
  }
  .sign-opt-btn:disabled { cursor: default; }
  .sign-opt-btn .letter {
    background: white;
    border: 2px solid var(--border);
    border-radius: 50%;
    min-width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.72rem;
    color: var(--mn-blue);
    flex-shrink: 0;
  }
  .sign-opt-btn.correct-choice { background: var(--correct-bg); border-color: var(--correct); }
  .sign-opt-btn.correct-choice .letter { background: var(--correct); border-color: var(--correct); color: white; }
  .sign-opt-btn.wrong-choice   { background: var(--wrong-bg);   border-color: var(--wrong); }
  .sign-opt-btn.wrong-choice .letter   { background: var(--wrong);   border-color: var(--wrong);   color: white; }
  .sign-opt-btn.reveal-correct { background: var(--correct-bg); border-color: var(--correct); animation: pulse 0.5s ease; }
  .sign-opt-btn.reveal-correct .letter { background: var(--correct); border-color: var(--correct); color: white; }
  .sign-tip {
    font-size: 0.82rem;
    color: var(--text-muted);
    font-weight: 600;
    text-align: center;
    background: #EEF4FF;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    line-height: 1.45;
    animation: fadeIn 0.3s ease;
    width: 100%;
  }
  .signs-score-banner {
    background: white;
    border-radius: var(--radius);
    padding: 16px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 20px;
    border-left: 5px solid var(--mn-blue);
    display: flex;
    align-items: center;
    gap: 14px;
    animation: fadeIn 0.5s ease;
  }
  .signs-score-banner .ssb-icon { font-size: 1.8rem; flex-shrink: 0; }
  .signs-score-banner .ssb-text h3 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--mn-blue);
    margin-bottom: 2px;
  }
  .signs-score-banner .ssb-text p { font-size: 0.88rem; color: var(--text-muted); font-weight: 600; }

  @media (max-width: 480px) {
    .signs-grid { grid-template-columns: 1fr 1fr; gap: 12px; }
    .sign-svg-wrap { width: 80px; height: 80px; }
    .sign-question { font-size: 0.85rem; }
    .sign-opt-btn { font-size: 0.82rem; padding: 7px 10px; }
  }
  .shuffle-btn {
    background: linear-gradient(135deg, var(--mn-gold) 0%, var(--mn-gold-dark) 100%);
    color: var(--mn-blue-dark);
    border: none;
    border-radius: 50px;
    padding: 9px 18px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.9rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    box-shadow: 0 3px 10px rgba(230,194,0,0.4);
    transition: all 0.2s;
    white-space: nowrap;
  }
  .shuffle-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(230,194,0,0.5); }
  .shuffle-btn:active { transform: translateY(0); }

  /* ── MAIN LAYOUT ── */
  main { max-width: 780px; margin: 0 auto; padding: 24px 16px 60px; }

  /* ── QUIZ MODE ── */
  .quiz-list { display: flex; flex-direction: column; gap: 20px; }
  .q-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    padding: 22px 22px 18px;
    box-shadow: var(--shadow);
    border: 2px solid transparent;
    transition: border-color 0.3s, box-shadow 0.3s;
    animation: slideUp 0.4s ease both;
  }
  @keyframes slideUp { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  .q-card.answered-correct { border-color: var(--correct); background: #F0FFF4; }
  .q-card.answered-wrong   { border-color: var(--wrong);   background: #FFF5F5; }
  .q-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.78rem;
    color: var(--mn-blue);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .q-num-badge {
    background: var(--mn-blue);
    color: white;
    border-radius: 50%;
    width: 24px; height: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.72rem;
    font-weight: 900;
    flex-shrink: 0;
  }
  .q-topic-tag {
    background: #EEF4FF;
    color: var(--mn-blue);
    border-radius: 50px;
    padding: 2px 10px;
    font-size: 0.72rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .q-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 3vw, 1.12rem);
    line-height: 1.45;
    color: var(--text-main);
    margin-bottom: 16px;
  }
  .options { display: flex; flex-direction: column; gap: 9px; }
  .option-btn {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    background: var(--neutral-bg);
    border: 2px solid transparent;
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    cursor: pointer;
    font-family: 'Nunito Sans', sans-serif;
    font-size: 0.97rem;
    font-weight: 600;
    color: var(--text-main);
    text-align: left;
    transition: all 0.18s;
    width: 100%;
    line-height: 1.4;
  }
  .option-btn:hover:not(:disabled) {
    background: #E8EFFE;
    border-color: var(--mn-blue-light);
    transform: translateX(3px);
  }
  .option-btn:disabled { cursor: default; }
  .option-btn .letter {
    background: white;
    border: 2px solid var(--border);
    border-radius: 50%;
    min-width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.8rem;
    color: var(--mn-blue);
    flex-shrink: 0;
    transition: all 0.18s;
  }
  .option-btn.correct-choice {
    background: var(--correct-bg);
    border-color: var(--correct);
  }
  .option-btn.correct-choice .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }
  .option-btn.wrong-choice {
    background: var(--wrong-bg);
    border-color: var(--wrong);
  }
  .option-btn.wrong-choice .letter {
    background: var(--wrong);
    border-color: var(--wrong);
    color: white;
  }
  .option-btn.reveal-correct {
    background: var(--correct-bg);
    border-color: var(--correct);
    animation: pulse 0.5s ease;
  }
  @keyframes pulse { 0%{transform:scale(1)} 50%{transform:scale(1.01)} 100%{transform:scale(1)} }
  .option-btn.reveal-correct .letter {
    background: var(--correct);
    border-color: var(--correct);
    color: white;
  }
  .feedback-tip {
    margin-top: 12px;
    padding: 10px 14px;
    background: #F0F7FF;
    border-left: 3px solid var(--mn-blue-light);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 0.87rem;
    color: var(--text-muted);
    font-weight: 600;
    line-height: 1.45;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-4px)} to{opacity:1;transform:translateY(0)} }
  .feedback-icon { display: inline-block; margin-right: 5px; }

  /* ── RESULTS SCREEN ── */
  .results-screen {
    text-align: center;
    background: white;
    border-radius: var(--radius);
    padding: 40px 28px;
    box-shadow: var(--shadow-lg);
    animation: fadeIn 0.5s ease;
  }
  .results-emoji { font-size: 4rem; margin-bottom: 12px; display: block; }
  .results-title {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.9rem;
    color: var(--mn-blue);
    margin-bottom: 8px;
  }
  .results-score {
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 3.5rem;
    color: var(--mn-gold-dark);
    line-height: 1;
    margin: 12px 0;
  }
  .results-out-of { font-size: 1.1rem; color: var(--text-muted); font-weight: 700; }
  .results-msg { font-size: 1.05rem; color: var(--text-muted); font-weight: 600; margin: 16px 0 28px; line-height: 1.5; }
  .pass-fail-badge {
    display: inline-block;
    padding: 8px 24px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1rem;
    letter-spacing: 0.05em;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .pass-badge { background: var(--correct-bg); color: #166534; border: 2px solid var(--correct); }
  .fail-badge { background: var(--wrong-bg);   color: #991B1B; border: 2px solid var(--wrong); }
  .results-actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary {
    background: linear-gradient(135deg, var(--mn-blue) 0%, var(--mn-blue-light) 100%);
    color: white;
    border: none;
    border-radius: 50px;
    padding: 13px 28px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(0,63,135,0.3);
    transition: all 0.2s;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,63,135,0.4); }
  .btn-secondary {
    background: var(--neutral-bg);
    color: var(--mn-blue);
    border: 2px solid var(--border);
    border-radius: 50px;
    padding: 13px 28px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-secondary:hover { background: #E8EFFE; border-color: var(--mn-blue-light); }

  /* ── FLASHCARD MODE ── */
  .flashcard-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    animation: fadeIn 0.4s ease;
  }
  .flashcard-nav {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    justify-content: center;
  }
  .nav-btn {
    background: white;
    border: 2px solid var(--border);
    border-radius: 50%;
    width: 44px; height: 44px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    font-size: 1.2rem;
    transition: all 0.2s;
    box-shadow: var(--shadow);
    color: var(--mn-blue);
    font-weight: 900;
  }
  .nav-btn:hover:not(:disabled) { background: var(--mn-blue); color: white; border-color: var(--mn-blue); transform: scale(1.05); }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .fc-progress-text {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--text-main);
  }
  .flashcard {
    width: 100%;
    max-width: 600px;
    background: white;
    border-radius: var(--radius);
    box-shadow: var(--shadow-lg);
    padding: 30px 26px 26px;
    border: 2px solid transparent;
    transition: border-color 0.3s;
    min-height: 200px;
  }
  .flashcard.fc-correct { border-color: var(--correct); background: #F0FFF4; }
  .flashcard.fc-wrong   { border-color: var(--wrong);   background: #FFF5F5; }
  .fc-q-num {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.78rem;
    color: var(--mn-blue);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 10px;
    display: flex; align-items: center; gap: 8px;
  }
  .fc-question {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: clamp(1.05rem, 3.5vw, 1.25rem);
    line-height: 1.45;
    color: var(--text-main);
    margin-bottom: 20px;
  }
  .fc-options { display: flex; flex-direction: column; gap: 10px; }
  .fc-tip {
    margin-top: 16px;
    padding: 12px 16px;
    background: #EEF4FF;
    border-radius: var(--radius-sm);
    font-size: 0.9rem;
    color: var(--text-muted);
    font-weight: 600;
    line-height: 1.5;
    animation: fadeIn 0.3s ease;
  }
  .fc-done-badge {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 20px;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.95rem;
    margin-top: 4px;
  }
  .fc-done-correct { background: var(--correct-bg); color: #166534; }
  .fc-done-wrong   { background: var(--wrong-bg);   color: #991B1B; }

  /* ── PROGRESS BAR ── */
  .progress-bar-wrap {
    background: var(--neutral-bg);
    border-radius: 50px;
    height: 6px;
    margin: 0 0 4px;
    overflow: hidden;
    width: 100%;
    max-width: 600px;
  }
  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--mn-blue) 0%, var(--mn-blue-light) 100%);
    border-radius: 50px;
    transition: width 0.4s ease;
  }

  /* ── INTRO BANNER ── */
  .intro-banner {
    background: white;
    border-radius: var(--radius);
    padding: 20px 22px;
    box-shadow: var(--shadow);
    margin-bottom: 24px;
    border-left: 5px solid var(--mn-gold);
    display: flex;
    align-items: flex-start;
    gap: 14px;
    animation: fadeIn 0.5s ease;
  }
  .intro-icon { font-size: 2rem; flex-shrink: 0; }
  .intro-text h3 {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 1rem;
    color: var(--mn-blue);
    margin-bottom: 4px;
  }
  .intro-text p { font-size: 0.9rem; color: var(--text-muted); font-weight: 600; line-height: 1.5; }

  /* ── TOPIC SECTION DIVIDERS ── */
  .topic-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 6px 0 2px;
    animation: fadeIn 0.4s ease;
  }
  .topic-divider-line { flex: 1; height: 1px; background: var(--border); }
  .topic-divider-label {
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  @media (max-width: 480px) {
    .top-bar { gap: 8px; padding: 10px 12px; }
    .score-pill { padding: 7px 14px; font-size: 0.9rem; }
    .mode-btn { padding: 6px 10px; font-size: 0.8rem; }
    .shuffle-btn { padding: 8px 14px; font-size: 0.85rem; }
    main { padding: 18px 12px 50px; }
    .q-card { padding: 18px 16px 16px; }
    .flashcard { padding: 22px 18px 20px; }
  }
</style>
</head>
<body>

<header>
  <span class="header-emoji">🌊</span>
  <div class="header-title">Minnesota <span>DMV</span> Practice</div>

// Shuffle signs options (generate 3 wrong names + correct for each sign quiz)
let signsSet = [];
let signsAnswers = [];

function buildSignsSet() {
  signsSet = shuffle([...SIGNS_DATA]);
  signsAnswers = new Array(signsSet.length).fill(-1);
}

function countSignsAnswered() { return signsAnswers.filter(a => a !== -1).length; }
function countSignsCorrect()  {
  return signsAnswers.filter((a, i) => {
    if (a === -1) return false;
    const q = signsSet[i];
    return q._options && q._options[a] === q.name;
  }).length;
}

function buildSignOptions(signIndex) {
  const correct = signsSet[signIndex].name;
  const others = SIGNS_DATA.filter(s => s.name !== correct).map(s => s.name);
  const wrongOpts = shuffle(others).slice(0, 3);
  const opts = shuffle([correct, ...wrongOpts]);
  signsSet[signIndex]._options = opts;
  signsSet[signIndex]._correctIdx = opts.indexOf(correct);
  return opts;
}


let mode = 'quiz';
let currentSet = [];
let answers = [];      // -1=unanswered, index=chosen
let fcIndex = 0;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newSet() {
  if (mode === 'signs') {
    buildSignsSet();
    updateTopBar();
    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
    return;
  }
  const indices = shuffle([...Array(ALL_QUESTIONS.length).keys()]).slice(0, 40);
  currentSet = indices.map(i => ALL_QUESTIONS[i]);
  answers = new Array(40).fill(-1);
  fcIndex = 0;
  updateTopBar();
  render();
}

function countAnswered() { return answers.filter(a => a !== -1).length; }
function countCorrect()  { return answers.filter((a, i) => a === currentSet[i].ans).length; }

function updateTopBar() {
  if (mode === 'signs') {
    const answered = countSignsAnswered();
    const correct = countSignsCorrect();
    document.getElementById('scoreDisplay').textContent =
      answered === 0 ? '0 / 0' : `${correct} / ${answered}`;
    document.getElementById('progressDisplay').textContent =
      `${answered} of ${signsSet.length} done`;
    return;
  }
  const answered = countAnswered();
  const correct = countCorrect();
  document.getElementById('scoreDisplay').textContent =
    answered === 0 ? '0 / 0' : `${correct} / ${answered}`;
  if (mode === 'quiz') {
    document.getElementById('progressDisplay').textContent =
      `${answered} of 40 done`;
  } else {
    document.getElementById('progressDisplay').textContent =
      `Q ${fcIndex + 1} of 40`;
  }
}

function setMode(m) {
  mode = m;
  document.getElementById('quizModeBtn').classList.toggle('active', m === 'quiz');
  document.getElementById('fcModeBtn').classList.toggle('active', m === 'flashcard');
  document.getElementById('signsModeBtn').classList.toggle('active', m === 'signs');
  document.getElementById('shuffleBtn').textContent = m === 'signs' ? '🔀 Reshuffle Signs' : '🔀 New Set of 40';
  fcIndex = 0;
  if (m === 'signs' && signsSet.length === 0) buildSignsSet();
  updateTopBar();
  render();
}

const LETTERS = ['A','B','C','D'];
const TOPIC_EMOJIS = {
  'Traffic Signs': '🚦', 'Traffic Signals': '🔴', 'Road Markings': '🛣️',
  'Speed Limits': '🚗', 'Right of Way': '⚖️', 'Emergency Vehicles': '🚨',
  'School Buses': '🚌', 'Railroad Crossings': '🚂', 'Following Distance': '📏',
  'Headlights': '💡', 'Winter Driving': '❄️', 'Motorcycles & Bicycles': '🏍️',
  'Parking': '🅿️', 'Alcohol & DWI': '🍺', 'Lane Changes': '↕️', 'MN Laws': '📜'
};

// ════════════════════════════════════════════
//  RENDER
// ════════════════════════════════════════════
function render() {
  const main = document.getElementById('mainContent');

  if (mode === 'quiz') {
    renderQuiz(main);
  } else if (mode === 'signs') {
    renderSigns(main);
  } else {
    renderFlashcard(main);
  }
}

function renderQuiz(main) {
  const allDone = countAnswered() === 40;

  if (allDone) {
    renderResults(main);
    return;
  }

  let html = `<div class="intro-banner">
    <div class="intro-icon">📖</div>
    <div class="intro-text">
      <h3>Quiz Mode — ${currentSet.length} Questions</h3>
      <p>Click an answer to get instant feedback. You need 32/40 (80%) to pass the real MN knowledge test!</p>
    </div>
  </div><div class="quiz-list">`;

  let lastTopic = null;
  currentSet.forEach((q, i) => {
    const chosen = answers[i];
    const answered = chosen !== -1;
    const correct = answered && chosen === q.ans;
    const cardClass = !answered ? '' : correct ? 'answered-correct' : 'answered-wrong';
    const emoji = TOPIC_EMOJIS[q.topic] || '📋';

    if (q.topic !== lastTopic) {
      if (lastTopic !== null) {
        html += `</div>`;
      }
      html += `<div class="topic-divider" style="animation-delay:${i*0.02}s">
        <div class="topic-divider-line"></div>
        <div class="topic-divider-label">${emoji} ${q.topic}</div>
        <div class="topic-divider-line"></div>
      </div>`;
      lastTopic = q.topic;
    }

    html += `<div class="q-card ${cardClass}" id="qcard-${i}" style="animation-delay:${Math.min(i*0.04,0.8)}s">
      <div class="q-num">
        <div class="q-num-badge">${i+1}</div>
        <span class="q-topic-tag">${emoji} ${q.topic}</span>
        ${answered ? (correct ? '<span style="color:var(--correct);font-size:1.1rem">✓ Correct!</span>' : '<span style="color:var(--wrong);font-size:1.1rem">✗ Incorrect</span>') : ''}
      </div>
      <div class="q-text">${q.q}</div>
      <div class="options">`;

    q.opts.forEach((opt, j) => {
      let cls = '';
      if (answered) {
        if (j === q.ans) cls = 'reveal-correct';
        else if (j === chosen && chosen !== q.ans) cls = 'wrong-choice';
      }
      const disabled = answered ? 'disabled' : '';
      html += `<button class="option-btn ${cls}" ${disabled} onclick="answerQ(${i}, ${j})">
        <span class="letter">${LETTERS[j]}</span>
        <span>${opt}</span>
      </button>`;
    });

    if (answered) {
      const icon = correct ? '✅' : '💡';
      html += `<div class="feedback-tip"><span class="feedback-icon">${icon}</span>${q.tip}</div>`;
    }

    html += `</div></div>`;
  });

  html += `</div></div>`;
  main.innerHTML = html;
}

function renderResults(main) {
  const correct = countCorrect();
  const pct = Math.round((correct / 40) * 100);
  const passed = correct >= 32;
  let emoji, msg;
  if (pct === 100) { emoji = '🏆'; msg = "Perfect score! You're ready to ace the real test!"; }
  else if (pct >= 90) { emoji = '🌟'; msg = "Excellent! You really know your MN driving laws!"; }
  else if (pct >= 80) { emoji = '✅'; msg = "Great job! You passed the practice test — keep it up!"; }
  else if (pct >= 70) { emoji = '📚'; msg = "Getting close! A little more studying and you'll be ready."; }
  else { emoji = '💪'; msg = "Keep practicing! Review the questions you missed and try again."; }

  main.innerHTML = `<div class="results-screen">
    <span class="results-emoji">${emoji}</span>
    <div class="results-title">Quiz Complete!</div>
    <div class="pass-fail-badge ${passed ? 'pass-badge' : 'fail-badge'}">${passed ? '✓ PASS' : '✗ NEEDS MORE STUDY'}</div>
    <div class="results-score">${correct}/40</div>
    <div class="results-out-of">${pct}% — You need 80% (32/40) to pass</div>
    <div class="results-msg">${msg}</div>
    <div class="results-actions">
      <button class="btn-primary" onclick="retrySet()">🔄 Retry Same Questions</button>
      <button class="btn-secondary" onclick="newSet()">🔀 New Set of 40</button>
    </div>
  </div>`;
}

function renderFlashcard(main) {
  const q = currentSet[fcIndex];
  const chosen = answers[fcIndex];
  const answered = chosen !== -1;
  const correct = answered && chosen === q.ans;
  const emoji = TOPIC_EMOJIS[q.topic] || '📋';
  const fcClass = !answered ? '' : correct ? 'fc-correct' : 'fc-wrong';

  const pct = ((fcIndex) / 40) * 100;

  let html = `<div class="flashcard-container">
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" style="width:${pct}%"></div>
    </div>
    <div class="flashcard-nav">
      <button class="nav-btn" onclick="fcNav(-1)" ${fcIndex === 0 ? 'disabled' : ''}>‹</button>
      <div class="fc-progress-text">Card ${fcIndex+1} of 40</div>
      <button class="nav-btn" onclick="fcNav(1)" ${fcIndex === 39 ? 'disabled' : ''}>›</button>
    </div>
    <div class="flashcard ${fcClass}">
      <div class="fc-q-num">
        <div class="q-num-badge">${fcIndex+1}</div>
        <span class="q-topic-tag">${emoji} ${q.topic}</span>
        ${answered ? (correct ? '<span style="color:var(--correct);font-weight:800">✓ Correct!</span>' : '<span style="color:var(--wrong);font-weight:800">✗ Incorrect</span>') : ''}
      </div>
      <div class="fc-question">${q.q}</div>
      <div class="fc-options">`;

  q.opts.forEach((opt, j) => {
    let cls = '';
    if (answered) {
      if (j === q.ans) cls = 'reveal-correct';
      else if (j === chosen && chosen !== q.ans) cls = 'wrong-choice';
    }
    const disabled = answered ? 'disabled' : '';
    html += `<button class="option-btn ${cls}" ${disabled} onclick="fcAnswer(${j})">
      <span class="letter">${LETTERS[j]}</span>
      <span>${opt}</span>
    </button>`;
  });

  if (answered) {
    html += `<div class="fc-tip">💡 ${q.tip}</div>`;
  }

  html += `</div></div>`;

  // Navigation bottom
  html += `<div style="display:flex;gap:12px;margin-top:4px;width:100%;max-width:600px;justify-content:space-between">`;
  if (fcIndex > 0) {
    html += `<button class="btn-secondary" onclick="fcNav(-1)" style="flex:1">‹ Previous</button>`;
  } else {
    html += `<div style="flex:1"></div>`;
  }
  if (answered && fcIndex < 39) {
    html += `<button class="btn-primary" onclick="fcNav(1)" style="flex:1">Next ›</button>`;
  } else if (fcIndex === 39 && answered) {
    html += `<button class="btn-primary" onclick="fcShowResults()" style="flex:1">See Results 🎉</button>`;
  } else {
    html += `<div style="flex:1"></div>`;
  }
  html += `</div>`;

  // Score summary
  const answered_count = countAnswered();
  const correct_count = countCorrect();
  if (answered_count > 0) {
    html += `<div style="text-align:center;color:var(--text-muted);font-weight:700;font-size:0.9rem;margin-top:4px">
      ${correct_count} correct out of ${answered_count} answered
    </div>`;
  }

  html += `</div>`;
  main.innerHTML = html;
}

function renderSigns(main) {
  const answered = countSignsAnswered();
  const correct = countSignsCorrect();
  const pct = signsSet.length > 0 ? Math.round((correct / signsSet.length) * 100) : 0;

  let html = `<div class="signs-score-banner">
    <div class="ssb-icon">🪧</div>
    <div class="ssb-text">
      <h3>Road Signs — Identify all ${signsSet.length} signs</h3>
      <p>Look at each sign and pick the correct name. ${answered > 0 ? `${correct} correct out of ${answered} answered (${pct}%)` : 'Click an answer to get instant feedback!'}</p>
    </div>
  </div>
  <div class="signs-grid">`;

  signsSet.forEach((sign, i) => {
    if (!sign._options) buildSignOptions(i);
    const chosen = signsAnswers[i];
    const isAnswered = chosen !== -1;
    const isCorrect = isAnswered && sign._options[chosen] === sign.name;
    const cardClass = !isAnswered ? '' : isCorrect ? 'sc-correct' : 'sc-wrong';

    html += `<div class="sign-card ${cardClass}" style="animation-delay:${Math.min(i*0.03,0.6)}s">
      <div class="sign-svg-wrap">${sign.svg}</div>
      <div class="sign-question">What sign is this?</div>
      <div class="sign-opts">`;

    sign._options.forEach((opt, j) => {
      let cls = '';
      if (isAnswered) {
        if (j === sign._correctIdx) cls = 'reveal-correct';
        else if (j === chosen && !isCorrect) cls = 'wrong-choice';
      }
      const disabled = isAnswered ? 'disabled' : '';
      html += `<button class="sign-opt-btn ${cls}" ${disabled} onclick="answerSign(${i}, ${j})">
        <span class="letter">${LETTERS[j]}</span>
        <span>${opt}</span>
      </button>`;
    });

    if (isAnswered) {
      html += `<div class="sign-tip">💡 ${sign.tip}</div>`;
    }

    html += `</div></div>`;
  });

  html += `</div>`;
  main.innerHTML = html;
}

function answerSign(signIndex, chosenIndex) {
  if (signsAnswers[signIndex] !== -1) return;
  signsAnswers[signIndex] = chosenIndex;
  renderSigns(document.getElementById('mainContent'));
  // Scroll the answered card into view
  setTimeout(() => {
    const cards = document.querySelectorAll('.sign-card');
    if (cards[signIndex]) cards[signIndex].scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}


function answerQ(qIndex, chosenIndex) {
  if (answers[qIndex] !== -1) return;
  answers[qIndex] = chosenIndex;
  updateTopBar();

  // Re-render just this card for performance
  const q = currentSet[qIndex];
  const correct = chosenIndex === q.ans;
  const card = document.getElementById(`qcard-${qIndex}`);
  if (!card) { render(); return; }

  card.className = `q-card ${correct ? 'answered-correct' : 'answered-wrong'}`;

  // Update options
  const btns = card.querySelectorAll('.option-btn');
  btns.forEach((btn, j) => {
    btn.disabled = true;
    if (j === q.ans) btn.classList.add('reveal-correct');
    else if (j === chosenIndex && !correct) btn.classList.add('wrong-choice');
  });

  // Update q-num status
  const qNum = card.querySelector('.q-num');
  const existingStatus = qNum.querySelector('.status-span');
  if (existingStatus) existingStatus.remove();
  const statusEl = document.createElement('span');
  statusEl.className = 'status-span';
  statusEl.style.cssText = `color:${correct ? 'var(--correct)' : 'var(--wrong)'};font-size:1.1rem`;
  statusEl.textContent = correct ? '✓ Correct!' : '✗ Incorrect';
  qNum.appendChild(statusEl);

  // Add tip
  const existingTip = card.querySelector('.feedback-tip');
  if (!existingTip) {
    const tip = document.createElement('div');
    tip.className = 'feedback-tip';
    tip.innerHTML = `<span class="feedback-icon">${correct ? '✅' : '💡'}</span>${q.tip}`;
    card.appendChild(tip);
  }

  // Check if all done
  if (countAnswered() === 40) {
    setTimeout(() => {
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 800);
  }

  // Scroll card into better view
  card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function fcAnswer(chosenIndex) {
  if (answers[fcIndex] !== -1) return;
  answers[fcIndex] = chosenIndex;
  updateTopBar();
  renderFlashcard(document.getElementById('mainContent'));
}

function fcNav(dir) {
  fcIndex = Math.max(0, Math.min(39, fcIndex + dir));
  updateTopBar();
  renderFlashcard(document.getElementById('mainContent'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function fcShowResults() {
  mode = 'quiz';
  document.getElementById('quizModeBtn').classList.add('active');
  document.getElementById('fcModeBtn').classList.remove('active');
  renderResults(document.getElementById('mainContent'));
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function retrySet() {
  answers = new Array(40).fill(-1);
  fcIndex = 0;
  updateTopBar();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════
newSet();
</script>
